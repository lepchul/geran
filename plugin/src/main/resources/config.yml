  broadcast-launch: "&c&l⚠ {name} был запущен из неизвестного места!"
  broadcast-impact: "&c&l⚠ Зафиксировано попадание!"
  placed: "&aАппарат установлен. Кликните по нему правой кнопкой."
  ask-coords: "&eВведите координаты цели: &fX Y Z"
  ask-coords-hint: "&7Например: &f{x} {y} {z}&7. Отмена — напишите &fотмена"
  bad-coords: "&cНужно три числа через пробел."
  bad-height: "&cТакой высоты в этом мире нет."
  too-far: "&cДо цели {dist} блоков, а дальность {max}."
  cancelled: "&7Запуск отменён."
  launched: "&aЦель {x} {y} {z}. Подлётное время ~{sec} сек."
  hud: "&8✈ &fдо цели &e{dist} &fбл. &7· высота {alt} &7· {phase}"
  phase-climb: "&eнабор высоты"
  phase-cruise: "&aмаршрут"
  phase-dive: "&cпикирование"
  hit: "&cПопадание: {x} {y} {z}"
  shot-down: "&cАппарат сбит."
  you-shot-down: "&aВы сбили БПЛА!"
  lost-battery: "&cТопливо кончилось, аппарат сдетонировал."
  lost-range: "&cОбрыв связи — аппарат сдетонировал."
  already-flying: "&cАппарат уже в воздухе."
  not-yours: "&cЭто не ваш аппарат."
  drone-gone: "&cАппарата больше нет."
