name: StrikeDrone
version: '${project.version}'
main: ru.factor.uav.UavPlugin
api-version: '1.20'
author: ZovPatriot
description: Ударный БПЛА со сборкой из компонентов.

commands:
  uav:
    description: Управление БПЛА
    usage: /uav <give|part|boom|reload>
    aliases: [bpla, drone2]

permissions:
  uav.use:
    description: Ставить и запускать БПЛА
    default: true
  uav.admin:
    description: Команды give, part, reload
    default: op
